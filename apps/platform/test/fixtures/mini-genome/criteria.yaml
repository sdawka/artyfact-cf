criteria:
  - id: C.system.structure
    title: Structure is consistent
    claim: The Genome loads and no pinned rule reports a hard violation.
    ownerKind: system
    ownerId: system.mini-kit
    subjectKind: system
    subjectId: system.mini-kit
    targetKind: model
    gates: [submission, promotion]
    hooks: [hook.system.structure]
  - id: C.system.promotion
    title: Changes stay in scope
    claim: A candidate changes only the paths its Task Packet permits.
    ownerKind: system
    ownerId: system.mini-kit
    subjectKind: system
    subjectId: system.mini-kit
    targetKind: artifact
    gates: [submission, promotion]
    hooks: [hook.system.scope]
  - id: C.system.readiness
    title: Concurrent work is known
    claim: Overlap with other open candidates is reported before promotion.
    ownerKind: system
    ownerId: system.mini-kit
    subjectKind: system
    subjectId: system.mini-kit
    targetKind: artifact
    gates: [submission, promotion]
    hooks: [hook.system.overlap]
hooks:
  - id: hook.system.structure
    assay: Run the pinned rule packs
    criteria: [C.system.structure]
    tier: basic
    engine: model-rules
    targetKind: model
    triggers: [submission]
    binding: bound
  - id: hook.system.scope
    assay: Changed paths within permitted globs
    criteria: [C.system.promotion]
    tier: basic
    engine: diff
    targetKind: artifact
    triggers: [submission]
    inputs: { mode: scope }
    binding: bound
  - id: hook.system.overlap
    assay: Overlap with concurrent candidates
    criteria: [C.system.readiness]
    tier: basic
    engine: diff
    targetKind: artifact
    triggers: [submission]
    inputs: { mode: overlap }
    binding: bound
