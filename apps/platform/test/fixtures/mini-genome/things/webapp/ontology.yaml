nodes:
  - id: screen.people
    kind: screen
    name: People
    parent: section.ui
    route: /people
    children:
      - { id: component.PageHeading, kind: component, name: Page heading }
      - id: component.AddContactDialog
        kind: component
        name: Add contact dialog
        fields:
          - { name: name, type: text }
        children:
          - id: affordance.AddContactDialog.save
            kind: affordance
            name: Save
            actor: owner
            effects: [Saves the contact for its owner]
            links:
              - { rel: invokes, to: operation.contact.save }
  - id: screen.home
    kind: screen
    name: Home
    parent: section.ui
    route: /
    children:
      - { id: component.DueList, kind: component, name: Due list }
  - id: entity.Account
    kind: entity
    name: Account
    parent: section.domain
    fields:
      - { name: email, type: text }
  - id: entity.ContactRecord
    kind: entity
    name: Contact record
    parent: section.domain
    fields:
      - { name: owner, type: ref:entity.Account }
      - { name: name, type: text }
  - id: operation.contact.save
    kind: operation
    name: Save contact
    parent: section.domain
    links:
      - { rel: writes, to: entity.ContactRecord }
  - id: operation.contact.list
    kind: operation
    name: List contacts
    parent: section.domain
    links:
      - { rel: reads, to: entity.ContactRecord }
  - id: policy.ownerOnly
    kind: policy
    name: Owner only
    parent: section.authorization
    mode: owner-only
    links:
      - { rel: governs, to: operation.contact.save }
      - { rel: governs, to: operation.contact.list }
      - { rel: governs, to: entity.ContactRecord }
