criteria:
  - id: C.webapp.screen.people
    title: People screen matches the Genome
    claim: The People screen shows the heading and the add-contact dialog.
    ownerKind: thing
    ownerId: thing.webapp
    subjectKind: screen
    subjectId: screen.people
    targetKind: artifact
    sourceRefs: [S.webapp.contacts]
    gates: [candidate, promotion]
    hooks: [hook.webapp.screen.people]
  - id: C.webapp.contact.save
    title: Saving a contact persists it
    claim: Save writes a ContactRecord owned by the actor.
    ownerKind: thing
    ownerId: thing.webapp
    subjectKind: affordance
    subjectId: affordance.AddContactDialog.save
    targetKind: artifact
    sourceRefs: [S.webapp.contacts]
    gates: [candidate, promotion]
    hooks: [hook.webapp.contact.save]
  - id: C.webapp.private.owner
    title: Contacts are private to their owner
    claim: Only the owner can read or write their contact records.
    ownerKind: thing
    ownerId: thing.webapp
    subjectKind: policy
    subjectId: policy.ownerOnly
    targetKind: artifact
    sourceRefs: [S.webapp.contacts]
    gates: [candidate, promotion]
    hooks: [hook.webapp.private.owner]
hooks:
  - id: hook.webapp.screen.people
    assay: People screen render test
    criteria: [C.webapp.screen.people]
    tier: execution
    engine: browser
    targetKind: artifact
    triggers: [candidate]
  - id: hook.webapp.contact.save
    assay: Save round-trip test
    criteria: [C.webapp.contact.save]
    tier: execution
    engine: vitest
    targetKind: artifact
    triggers: [candidate]
  - id: hook.webapp.private.owner
    assay: Cross-owner access test
    criteria: [C.webapp.private.owner]
    tier: execution
    engine: vitest
    targetKind: artifact
    triggers: [candidate]
