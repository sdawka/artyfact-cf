id: thing.webapp
kind: thing
template: template.thing.cloudflare-worker-webapp@1
fields:
  name: Web app
  description: The Keep in Touch web app
  sections:
    - section.ui
    - section.domain
    - section.authorization
    - section.runtime
  artifacts:
    - artifact: artifact.webapp
      type: worker-fullstack
      repo: kit-app
      scope: []
criteria:
  - id: C.webapp.exists
    title: Web app exists
    claim: The app has the files a deployable Worker needs.
    target: artifact
    gates:
      - candidate
      - promotion
    hooks:
      - id: hook.webapp.exists
        assay: webapp.requiredFiles
        tier: basic
        engine: manifest
        triggers:
          - candidate
          - promotion
        inputs:
          requiredFiles: wrangler.jsonc,src/index.ts,package.json
        binding: bound
        fromTemplate: template.thing.cloudflare-worker-webapp@1
    fromTemplate: template.thing.cloudflare-worker-webapp@1
  - id: C.webapp.health
    title: Web app is healthy
    claim: The running app answers its health endpoint.
    target: runtime
    gates:
      - deployment
      - outcome
    hooks:
      - id: hook.webapp.health
        assay: webapp.health
        tier: execution
        engine: http
        triggers:
          - deployment
          - outcome
        inputs:
          path: /health
        timeoutMs: 2000
        fromTemplate: template.thing.cloudflare-worker-webapp@1
    fromTemplate: template.thing.cloudflare-worker-webapp@1
