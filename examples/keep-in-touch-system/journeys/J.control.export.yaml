id: J.control.export
name: Export my data
actorGoal: Take a copy of the records I own
features:
- GD.contacts
requirements:
- S.webapp.operations
start: x1
steps:
- id: x1
  actor: user
  action: Open Settings
  kind: action
  screen: screen.settings
  next:
  - to: x2
  requirementRefs:
  - S.webapp.screens
- id: x2
  actor: user
  action: Choose Export in ExportControls and reauthenticate
  kind: action
  screen: screen.settings
  next:
  - to: x3
  requirementRefs:
  - S.webapp.operations
- id: x3
  actor: system
  action: Owner reauthentication checked
  kind: branch
  screen: screen.settings
  next:
  - to: x4
    when: reauthenticated
  - to: f1
    when: reauthentication failed
  requirementRefs:
  - S.webapp.operations
- id: x4
  actor: system
  action: Export authorized records of the authenticated owner only
  kind: action
  screen: screen.settings
  operation: operation.data.export
  next:
  - to: e1
  requirementRefs:
  - S.webapp.operations
- id: f1
  actor: system
  action: Export refused; nothing produced
  kind: failure
  screen: screen.settings
  next:
  - to: e2
    when: stop
  requirementRefs:
  - S.webapp.operations
- id: e1
  actor: user
  action: Receive export excluding other people's data; copies already made cannot be recalled
  kind: end
  screen: screen.settings
  next: []
  requirementRefs:
  - S.webapp.operations
- id: e2
  actor: user
  action: No export produced
  kind: end
  screen: screen.settings
  next: []
  requirementRefs:
  - S.webapp.operations
