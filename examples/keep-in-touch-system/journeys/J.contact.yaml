id: J.contact
name: Reach out to one person
actorGoal: Open a channel to one person and record what actually happened
features:
- GD.prompts
requirements:
- S.webapp.scope
- S.webapp.qualification
start: c1
steps:
- id: c1
  actor: user
  action: Select one person
  kind: action
  screen: screen.person
  next:
  - to: c2
  requirementRefs:
  - S.webapp.scope
- id: c2
  actor: user
  action: Open their preferred channel by an explicit gesture, or copy contact details if the channel
    is unsupported
  kind: action
  screen: screen.person
  external: ext.channels
  next:
  - to: c3
  requirementRefs:
  - S.webapp.scope
- id: c3
  actor: external
  action: Conversation or meeting happens outside the app; opening the channel completes no goal
  kind: wait
  external: ext.channels
  next:
  - to: c4
  requirementRefs:
  - S.webapp.qualification
- id: c4
  actor: user
  action: Log what happened?
  kind: branch
  screen: screen.person
  next:
  - to: c5
    when: log contact
  - to: e2
    when: skip logging
  requirementRefs:
  - S.webapp.qualification
- id: c5
  actor: user
  action: Fill the contact event form and optionally mark Met this goal
  kind: branch
  screen: screen.logContact
  operation: operation.contact.log
  next:
  - to: e1
    when: Met this goal checked
  - to: e2
    when: unchecked
  requirementRefs:
  - S.webapp.qualification
- id: e1
  actor: system
  action: Event qualifies the goal; due date recomputed from the qualifying event
  kind: end
  screen: screen.person
  operation: operation.contact.log
  next: []
  requirementRefs:
  - S.webapp.qualification
- id: e2
  actor: system
  action: No goal completed; event, if logged, does not qualify
  kind: end
  screen: screen.person
  next: []
  requirementRefs:
  - S.webapp.qualification
