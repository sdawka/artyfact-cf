id: operation.invite.create
kind: operation
fields:
  name: Create invite
  description: Authenticated inviter. Generate at least 128 bits of randomness, store only a token hash, expire after 24 hours and allow one successful acceptance
  source:
    doc: keep-in-touch-world-specification
    section: "6"
  preconditions:
    - Authenticated inviter
  effects:
    - Generate at least 128 bits of randomness
    - Store only a token hash
    - Expire after 24 hours
    - Allow one successful acceptance
  failure:
    - Unauthenticated inviter is denied
    - Blocked pair is refused
links:
  - { rel: writes, to: entity.ConnectionInvite }
