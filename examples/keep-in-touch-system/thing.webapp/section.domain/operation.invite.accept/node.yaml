id: operation.invite.accept
kind: operation
fields:
  name: Accept invite
  description: Signed-in distinct invitee, valid unused credential, no block in either direction. Atomically consume invite and create or return the unique active pair
  source:
    doc: keep-in-touch-world-specification
    section: "6"
  preconditions:
    - Signed-in distinct invitee
    - Valid unused credential
    - No block in either direction
  effects:
    - Atomically consume invite and create or return the unique active pair
  failure:
    - Invalid, expired or used credential is refused
    - Self-connection is refused
    - Block in either direction is refused
    - Two concurrent accept requests yield neither two pairs nor two redemptions
links:
  - { rel: reads, to: entity.Block }
  - { rel: writes, to: entity.ConnectionInvite }
  - { rel: writes, to: entity.Connection }
criteria:
  - id: C.webapp.connection.consent
    title: Connection consent
    claim: Invite fixture covers acceptance, expiry, replay, self-connection, block and simultaneous redemption
    target: artifact
    gates:
      - candidate
      - promotion
    sourceRefs:
      - S.webapp.operations
      - S.webapp.concurrency
    hooks:
      - id: hook.webapp.connection.consent
        assay: webapp.connection.consent
        tier: execution
        engine: vitest
        triggers:
          - candidate
          - promotion
        inputs:
          fixture: invite state machine incl. concurrent redemption
        costTier: cheap
