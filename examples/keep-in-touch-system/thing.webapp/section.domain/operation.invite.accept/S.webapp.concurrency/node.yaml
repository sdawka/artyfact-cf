id: S.webapp.concurrency
kind: requirement
fields:
  thing: thing.webapp
  title: Concurrency and revocation
  text: invite redemption must survive two concurrent accept requests without two pairs or two redemptions. Read and send authorization must check revocation against current authoritative state. Already delivered external messages or copied data remain outside our ability to retract.
  enabled: true
  source:
    doc: keep-in-touch-world-specification
    section: "6"
links:
