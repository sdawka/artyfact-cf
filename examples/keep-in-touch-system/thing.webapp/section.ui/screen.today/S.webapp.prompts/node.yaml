id: S.webapp.prompts
kind: requirement
fields:
  thing: thing.webapp
  title: Today prompts
  text: Today must return at most five suggestions, ordered by effective due date then stable goal ID. There must be at most one open suggestion per goal version and due cycle. Logging qualifying contact must resolve its suggestion. Snoozing must update its effective due date; pausing must suppress prompts. Blocking a linked counterpart must pause the blocker's corresponding goal and suppress its suggestions. In-app reminders are required. Optional external reminders, when enabled, must be limited to one owner notification per local day containing a link without contact details. Reminder delivery must recheck preferences and cancellations.
  enabled: true
  source:
    doc: keep-in-touch-world-specification
    section: "6"
links:
  - { rel: subject, to: screen.today }
  - { rel: subject, to: entity.Suggestion }
  - { rel: subject, to: entity.NotificationJob }
  - { rel: refines, to: GD.prompts }
