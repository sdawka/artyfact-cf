id: thing.webapp
kind: thing
template: template.thing.cloudflare-worker-webapp@1
fields:
  name: Keep in Touch web app
  description: "The app definition within the System Genome: one full-stack Worker application containing UI, API, scheduler code, configuration and migrations. Domain types are runtime records inside this Thing, not separate Things."
  purposeRefs:
    - P1
  sections:
    - section.ui
    - section.domain
    - section.authorization
    - section.runtime
  artifacts:
    - artifact: artifact.webapp
      type: worker-fullstack
      repo: keep-in-touch-webapp
      scope: []
    - artifact: artifact.model-kit
      type: model-kit
      repo: keep-in-touch-model-kit
      scope: []
criteria:
  - id: C.webapp.exists
    title: Web app exists
    claim: The app has the files a deployable Worker needs.
    target: artifact
    gates:
      - candidate
      - promotion
    hooks:
      - id: hook.webapp.exists
        assay: webapp.requiredFiles
        tier: basic
        engine: manifest
        triggers:
          - candidate
          - promotion
        inputs:
          requiredFiles: wrangler.jsonc,src/index.ts,package.json
        binding: bound
        fromTemplate: template.thing.cloudflare-worker-webapp@1
    fromTemplate: template.thing.cloudflare-worker-webapp@1
  - id: C.webapp.health
    title: Web app is healthy
    claim: The running app answers its health endpoint.
    target: runtime
    gates:
      - deployment
      - outcome
    hooks:
      - id: hook.webapp.health
        assay: webapp.health
        tier: execution
        engine: http
        triggers:
          - deployment
          - outcome
        inputs:
          path: /health
        timeoutMs: 2000
        fromTemplate: template.thing.cloudflare-worker-webapp@1
    fromTemplate: template.thing.cloudflare-worker-webapp@1
  - id: C.webapp.checks
    title: Changed nodes meet their checks
    claim: Changed nodes meet the checks their kinds declare.
    severity: soft
    gates:
      - submission
    hooks:
      - id: hook.webapp.checks
        assay: webapp.checks
        tier: semantic
        engine: model-rules
        triggers:
          - submission
        inputs:
          packs: checks@1
        binding: bound
        fromTemplate: template.thing.cloudflare-worker-webapp@1
    fromTemplate: template.thing.cloudflare-worker-webapp@1
