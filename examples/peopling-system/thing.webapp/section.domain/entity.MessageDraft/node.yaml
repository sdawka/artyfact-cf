id: entity.MessageDraft
kind: entity
fields:
  name: MessageDraft
  description: ID, author, exactly one recipient, body, approved attachments and state; no autonomous send
  source:
    doc: peopling-world-specification
    section: "5"
  fields:
    - name: id
      type: string
      optional: false
    - name: authorAccountId
      type: ref:entity.Account
      optional: false
    - name: recipientAccountId
      type: ref:entity.Account
      optional: false
    - name: body
      type: string
      optional: false
    - name: approvedAttachments
      type: list<ref:entity.MediaAsset>
      optional: true
    - name: state
      type: string
      optional: false
  invariants:
    - Exactly one recipient
    - No autonomous send
provisional: true
