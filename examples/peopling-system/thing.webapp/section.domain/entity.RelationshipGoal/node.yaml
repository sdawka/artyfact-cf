id: entity.RelationshipGoal
kind: entity
fields:
  name: RelationshipGoal
  description: ID, owner, ContactRecord, intervalDays, desiredDepth, channel, anchorDate, pause and snooze; owner-only
  source:
    doc: peopling-world-specification
    section: "5"
  fields:
    - name: id
      type: string
      optional: false
    - name: ownerAccountId
      type: ref:entity.Account
      optional: false
    - name: contactRecordId
      type: ref:entity.ContactRecord
      optional: false
    - name: intervalDays
      type: int 1..3650
      optional: false
    - name: desiredDepth
      type: enum light|meaningful|shared-time
      optional: false
    - name: channel
      type: string
      optional: true
    - name: anchorDate
      type: local-date
      optional: false
    - name: pausedAt
      type: timestamp
      optional: true
    - name: snoozedUntil
      type: local-date
      optional: true
    - name: version
      type: int
      optional: false
  invariants:
    - Owner-only
    - At most one current goal per owned contact
    - Goal is never exposed to its contact
links:
  - { rel: storedIn, to: binding.contactsStore }
files:
  - src/worker/routes/goals.ts
criteria:
  - id: C.webapp.schedule.correct
    title: Schedule correctness
    claim: Fixed-clock fixtures cover zero logs, qualification, interval and depth changes, time zones, DST, snooze, pause and deleted events
    target: artifact
    gates:
      - candidate
      - promotion
    sourceRefs:
      - S.webapp.qualification
      - S.webapp.due
    hooks:
      - id: hook.webapp.schedule.correct
        assay: webapp.schedule.correct
        tier: execution
        engine: vitest
        triggers:
          - candidate
          - promotion
        inputs:
          fixture: fixed-clock scheduling fixtures with IANA zones and DST
        costTier: cheap
