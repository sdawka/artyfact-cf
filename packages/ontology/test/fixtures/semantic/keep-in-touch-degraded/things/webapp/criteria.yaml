# Thing-owned criteria for thing.webapp (spec section 7). C.webapp.exists and C.webapp.health come from the template.
criteria:
  - id: C.webapp.private.owner
    title: Owner-only access
    claim: "API fixture proves one user cannot read or mutate another's contacts, notes, goals or logs. Include guessed IDs and export"
    ownerKind: thing
    ownerId: thing.webapp
    subjectKind: policy
    subjectId: policy.ownerOnly
    targetKind: artifact
    sourceRefs: [S.webapp.operations]
    satisfies: [C.system.autonomy]
    gates: [candidate, promotion]
    hooks: [hook.webapp.private.owner]
  - id: C.webapp.connection.consent
    title: Connection consent
    claim: "Invite fixture covers acceptance, expiry, replay, self-connection, block and simultaneous redemption"
    ownerKind: thing
    ownerId: thing.webapp
    subjectKind: operation
    subjectId: operation.invite.accept
    targetKind: artifact
    sourceRefs: [S.webapp.operations, S.webapp.concurrency]
    gates: [candidate, promotion]
    hooks: [hook.webapp.connection.consent]
  - id: C.webapp.outgoing.single
    title: Single outgoing target
    claim: "Direct-action schema accepts exactly one target and rejects recipient arrays and group endpoints. Publication requires a separately accepted contract"
    ownerKind: thing
    ownerId: thing.webapp
    subjectKind: section
    subjectId: section.domain
    targetKind: artifact
    sourceRefs: [S.webapp.scope]
    satisfies: [C.system.topology]
    gates: [candidate, promotion]
    hooks: [hook.webapp.outgoing.single]
  - id: C.webapp.schedule.correct
    title: Schedule correctness
    claim: "Fixed-clock fixtures cover zero logs, qualification, interval and depth changes, time zones, DST, snooze, pause and deleted events"
    ownerKind: thing
    ownerId: thing.webapp
    subjectKind: entity
    subjectId: entity.RelationshipGoal
    targetKind: artifact
    sourceRefs: [S.webapp.qualification, S.webapp.due]
    gates: [candidate, promotion]
    hooks: [hook.webapp.schedule.correct]
  - id: C.webapp.prompts.bounded
    title: Bounded prompts
    claim: "Six due goals yield exactly five ordered cards. Duplicate jobs must not duplicate prompts or owner reminders"
    ownerKind: thing
    ownerId: thing.webapp
    subjectKind: screen
    subjectId: screen.today
    targetKind: artifact
    sourceRefs: [S.webapp.prompts]
    satisfies: [C.system.autonomy]
    gates: [candidate, promotion]
    hooks: [hook.webapp.prompts.bounded]
  - id: C.webapp.screen.exact
    title: Screen composition
    claim: "Protected browser fixture checks loaded, empty, loading, error and validation compositions, login continuation and keyboard actions"
    ownerKind: thing
    ownerId: thing.webapp
    subjectKind: section
    subjectId: section.ui
    targetKind: artifact
    sourceRefs: [S.webapp.screens, S.webapp.authentication]
    gates: [candidate, promotion]
    hooks: [hook.webapp.screen.exact]
  - id: C.webapp.revocation.current
    title: Current revocation
    claim: "Revoke access after a job is queued, then retry dispatch and access. No new authorized sharing may follow revocation"
    ownerKind: thing
    ownerId: thing.webapp
    subjectKind: policy
    subjectId: policy.revocation
    targetKind: artifact
    sourceRefs: [S.webapp.concurrency]
    gates: [candidate, promotion]
    hooks: [hook.webapp.revocation.current]
  - id: C.webapp.lifecycle.data
    title: Data lifecycle
    claim: "Owner export excludes others' data. Account deletion revokes sessions and jobs and meets live-data purge and retention contracts"
    ownerKind: thing
    ownerId: thing.webapp
    subjectKind: operation
    subjectId: operation.data.delete
    targetKind: artifact
    sourceRefs: [S.webapp.operations]
    gates: [candidate, promotion]
    hooks: [hook.webapp.lifecycle.data]
  - id: C.webapp.screen.people
    title: People screen
    claim: "Refines C.webapp.screen.exact for loaded, empty, loading, error and dialog states"
    ownerKind: thing
    ownerId: thing.webapp
    subjectKind: screen
    subjectId: screen.people
    targetKind: artifact
    sourceRefs: [S.webapp.screens]
    refines: [C.webapp.screen.exact]
    gates: [candidate, promotion]
    hooks: [hook.webapp.screen.people]
  - id: C.webapp.contact.save
    title: Contact save
    claim: "Validates nonblank name, preserves input on failure and saves only an owned record; refines S.webapp.operations coverage"
    ownerKind: thing
    ownerId: thing.webapp
    subjectKind: affordance
    subjectId: affordance.AddContactDialog.save
    targetKind: artifact
    sourceRefs: [S.webapp.operations]
    refines: [C.webapp.screen.exact, C.webapp.private.owner]
    gates: [candidate, promotion]
    hooks: [hook.webapp.contact.save]
  - id: C.webapp.contact.storage
    title: Contact storage
    claim: "Contact storage behaves the way a reasonable person would expect it to"
    ownerKind: thing
    ownerId: thing.webapp
    subjectKind: entity
    subjectId: entity.ContactRecord
    targetKind: artifact
    sourceRefs: [S.webapp.operations]
    gates: [candidate, promotion]
    hooks: [hook.webapp.contact.storage]
  - id: C.webapp.digest.private
    title: Private digests (later)
    claim: "Later digest specification; subscriber permissions, future-only editions, no shared replies and blocked or unsubscribed access. Applicable only after the module is enabled"
    ownerKind: thing
    ownerId: thing.webapp
    subjectKind: section
    subjectId: section.domain
    targetKind: artifact
    gates: [candidate, promotion]
    applicableWhen: module enabled
    deferred: true
    hooks: [hook.webapp.digest.private]
  - id: C.webapp.photo.approved
    title: Photo approval (later)
    claim: "Later photo specification; no upload or send before explicit file and recipient approval. Declined permission must leave the manual app usable. Applicable only after the module is enabled"
    ownerKind: thing
    ownerId: thing.webapp
    subjectKind: section
    subjectId: section.domain
    targetKind: artifact
    gates: [candidate, promotion]
    applicableWhen: module enabled
    deferred: true
    hooks: [hook.webapp.photo.approved]
hooks:
  - id: hook.webapp.private.owner
    assay: webapp.private.owner
    criteria: [C.webapp.private.owner]
    tier: execution
    engine: vitest
    targetKind: artifact
    triggers: [candidate, promotion]
    inputs:
      fixture: "two-account API fixture incl. guessed ids and export"
    timeoutMs: 60000
    costTier: cheap
    binding: defined
  - id: hook.webapp.connection.consent
    assay: webapp.connection.consent
    criteria: [C.webapp.connection.consent]
    tier: execution
    engine: vitest
    targetKind: artifact
    triggers: [candidate, promotion]
    inputs:
      fixture: "invite state machine incl. concurrent redemption"
    timeoutMs: 60000
    costTier: cheap
    binding: defined
  - id: hook.webapp.outgoing.single
    assay: webapp.outgoing.single
    criteria: [C.webapp.outgoing.single]
    tier: execution
    engine: vitest
    targetKind: artifact
    triggers: [candidate, promotion]
    inputs:
      fixture: "direct-action schema accepts one target, rejects arrays and groups"
    timeoutMs: 60000
    costTier: cheap
    binding: defined
  - id: hook.webapp.schedule.correct
    assay: webapp.schedule.correct
    criteria: [C.webapp.schedule.correct]
    tier: execution
    engine: vitest
    targetKind: artifact
    triggers: [candidate, promotion]
    inputs:
      fixture: "fixed-clock scheduling fixtures with IANA zones and DST"
    timeoutMs: 60000
    costTier: cheap
    binding: defined
  - id: hook.webapp.prompts.bounded
    assay: webapp.prompts.bounded
    criteria: [C.webapp.prompts.bounded]
    tier: execution
    engine: vitest
    targetKind: artifact
    triggers: [candidate, promotion]
    inputs:
      fixture: "six due goals yield five ordered cards"
    timeoutMs: 60000
    costTier: cheap
    binding: defined
  - id: hook.webapp.screen.exact
    assay: webapp.screen.exact
    criteria: [C.webapp.screen.exact]
    tier: execution
    engine: browser
    targetKind: artifact
    triggers: [candidate, promotion]
    inputs:
      fixture: "protected browser fixture over all screens"
    timeoutMs: 120000
    costTier: expensive
    binding: defined
  - id: hook.webapp.revocation.current
    assay: webapp.revocation.current
    criteria: [C.webapp.revocation.current]
    tier: execution
    engine: vitest
    targetKind: artifact
    triggers: [candidate, promotion]
    inputs:
      fixture: "revoke after queue, retry dispatch and access"
    timeoutMs: 60000
    costTier: cheap
    binding: defined
  - id: hook.webapp.lifecycle.data
    assay: webapp.lifecycle.data
    criteria: [C.webapp.lifecycle.data]
    tier: execution
    engine: vitest
    targetKind: artifact
    triggers: [candidate, promotion]
    inputs:
      fixture: "export isolation, deletion purge and retention"
    timeoutMs: 60000
    costTier: cheap
    binding: defined
  - id: hook.webapp.screen.people
    assay: webapp.screen.people
    criteria: [C.webapp.screen.people]
    tier: execution
    engine: browser
    targetKind: artifact
    triggers: [candidate, promotion]
    inputs:
      fixture: "People states: loaded, empty, loading, error, dialog"
    timeoutMs: 120000
    costTier: expensive
    binding: defined
  - id: hook.webapp.contact.save
    assay: webapp.contact.save
    criteria: [C.webapp.contact.save]
    tier: execution
    engine: browser
    targetKind: artifact
    triggers: [candidate, promotion]
    inputs:
      fixture: "blank name rejected, input preserved on failure, owned record saved"
    timeoutMs: 120000
    costTier: expensive
    binding: defined
  - id: hook.webapp.contact.storage
    assay: webapp.contact.storage
    criteria: [C.webapp.contact.storage]
    tier: execution
    engine: vitest
    targetKind: artifact
    triggers: [candidate, promotion]
    inputs:
      fixture: "owner and version constraints via binding.contactsStore"
    timeoutMs: 60000
    costTier: cheap
    binding: defined
  - id: hook.webapp.digest.private
    assay: webapp.digest.private
    criteria: [C.webapp.digest.private]
    tier: execution
    engine: vitest
    targetKind: artifact
    triggers: [candidate, promotion]
    inputs:
      fixture: "subscriber permissions, future-only editions, no shared replies"
    timeoutMs: 60000
    costTier: cheap
    binding: defined
  - id: hook.webapp.photo.approved
    assay: webapp.photo.approved
    criteria: [C.webapp.photo.approved]
    tier: execution
    engine: vitest
    targetKind: artifact
    triggers: [candidate, promotion]
    inputs:
      fixture: "no upload or send before explicit file and recipient approval"
    timeoutMs: 60000
    costTier: cheap
    binding: defined
