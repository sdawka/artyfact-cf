# spec §1 Thing, base Artifact and model-kit Artifact
id: thing.webapp
name: Keep in Touch web app
templateRef: template.thing.cloudflare-worker-webapp@1
description: >-
  The app definition within the System Genome: one full-stack Worker application containing UI, API,
  scheduler code, configuration and migrations. Domain types are runtime records inside this Thing, not separate Things.
artifacts:
  - { artifact: artifact.webapp, type: worker-fullstack, repo: keep-in-touch-webapp }
  - { artifact: artifact.model-kit, type: model-kit, repo: keep-in-touch-model-kit }
purposeRefs: [P1]
