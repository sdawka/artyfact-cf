criteria:
  - id: C.webapp.exists
    title: Web app exists
    claim: The app has the files a deployable Worker needs.
    ownerKind: thing
    ownerId: "$thing"
    subjectKind: thing
    subjectId: "$thing"
    targetKind: artifact
    gates: [candidate, promotion]
    hooks: [hook.webapp.exists]
  - id: C.webapp.health
    title: Web app is healthy
    claim: The running app answers its health endpoint.
    ownerKind: thing
    ownerId: "$thing"
    subjectKind: thing
    subjectId: "$thing"
    targetKind: runtime
    gates: [deployment, outcome]
    hooks: [hook.webapp.health]
  - id: C.webapp.checks
    title: Changed nodes meet their checks
    claim: Changed nodes meet the checks their kinds declare.
    ownerKind: thing
    ownerId: "$thing"
    subjectKind: thing
    subjectId: "$thing"
    targetKind: model
    severity: soft
    gates: [submission]
    hooks: [hook.webapp.checks]
hooks:
  - id: hook.webapp.exists
    assay: webapp.requiredFiles
    criteria: [C.webapp.exists]
    tier: basic
    engine: manifest
    targetKind: artifact
    triggers: [candidate, promotion]
    inputs:
      requiredFiles: "wrangler.jsonc,src/index.ts,package.json"
    binding: bound
  - id: hook.webapp.health
    assay: webapp.health
    criteria: [C.webapp.health]
    tier: execution
    engine: http
    targetKind: runtime
    triggers: [deployment, outcome]
    inputs:
      path: /health
    timeoutMs: 2000
    binding: defined
  - id: hook.webapp.checks
    assay: webapp.checks
    criteria: [C.webapp.checks]
    tier: semantic
    engine: model-rules
    targetKind: model
    triggers: [submission]
    inputs:
      packs: "checks@1"
    binding: bound
