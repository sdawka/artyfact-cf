- glob: src/worker/health.ts
  nodes: ["$thing"]
- glob: migrations/**
  nodes: [binding.d1]
- glob: src/ui/**
  nodes: [section.ui]
- glob: src/worker/routes/**
  nodes: [section.domain]
- glob: system/**
  nodes: [genome]
# App infrastructure: dependencies, Worker config, runtime env, the Phenome helper, tests, static assets. These are
# realized by the app Thing itself; without them every template upgrade is unmapped and cannot be promoted.
- glob: "{package.json,package-lock.json,tsconfig.json,vitest.config.ts,wrangler.jsonc,wrangler.test.jsonc,.gitignore,.dev.vars.example,README.md}"
  nodes: ["$thing"]
- glob: src/index.ts
  nodes: ["$thing"]
# src/worker/auth.ts is policy code and source-map.yaml decides scope: both stay unmapped here; apps must map auth.ts to their policy node.
- glob: src/worker/env.ts
  nodes: ["$thing"]
- glob: src/worker/phenome.ts
  nodes: ["$thing"]
- glob: test/**
  nodes: ["$thing"]
# Top-level static files only: an app's own public/<screen>/** mappings stay specific.
- glob: public/*
  nodes: ["$thing"]
- glob: .artyfact/**
  nodes: ["$thing"]
