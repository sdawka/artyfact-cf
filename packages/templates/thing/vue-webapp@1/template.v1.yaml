id: template.thing.vue-webapp
kind: thing
version: "1"
name: Vue web app
description: Vue single-page app served by a Cloudflare Worker. Same section contract as cloudflare-worker-webapp; proves a Thing can swap its UI stack.
sections:
  - section.ui
  - section.domain
  - section.authorization
  - section.runtime
nodes:
  - id: section.ui
    kind: section
    name: UI
    parent: "$thing"
    owningThing: "$thing"
    description: Vue screens, shared components and affordances.
  - id: section.domain
    kind: section
    name: Domain
    parent: "$thing"
    owningThing: "$thing"
    description: Entities, operations and invariants.
  - id: section.authorization
    kind: section
    name: Authorization
    parent: "$thing"
    owningThing: "$thing"
    description: Policies governing who may read or change what.
  - id: section.runtime
    kind: section
    name: Runtime
    parent: "$thing"
    owningThing: "$thing"
    description: Bindings and deployment surface.
  - id: binding.worker
    kind: binding
    name: Worker with static assets
    parent: section.runtime
    owningThing: "$thing"
  - id: binding.d1
    kind: binding
    name: D1 database
    parent: section.runtime
    owningThing: "$thing"
    provisional: true
  - id: component.App
    kind: component
    name: App
    parent: section.ui
    owningThing: "$thing"
    description: Vue root component; mounts the router view.
  - id: component.Router
    kind: component
    name: Router
    parent: component.App
    owningThing: "$thing"
    description: vue-router instance mapping routes to screens.
criteria:
  - id: C.webapp.exists
    title: Web app exists
    claim: The app has the files a deployable Worker needs.
    ownerKind: thing
    ownerId: "$thing"
    subjectKind: thing
    subjectId: "$thing"
    targetKind: artifact
    gates: [candidate, promotion]
    hooks: [hook.webapp.exists]
  - id: C.webapp.health
    title: Web app is healthy
    claim: The running app answers its health endpoint.
    ownerKind: thing
    ownerId: "$thing"
    subjectKind: thing
    subjectId: "$thing"
    targetKind: runtime
    gates: [deployment, outcome]
    hooks: [hook.webapp.health]
  - id: C.$thing.checks
    title: Changed nodes meet their checks
    claim: Changed nodes meet the checks their kinds declare.
    ownerKind: thing
    ownerId: "$thing"
    subjectKind: thing
    subjectId: "$thing"
    targetKind: model
    severity: soft
    gates: [submission]
    hooks: [hook.$thing.checks]
hooks:
  - id: hook.webapp.exists
    assay: webapp.requiredFiles
    criteria: [C.webapp.exists]
    tier: basic
    engine: manifest
    targetKind: artifact
    triggers: [candidate, promotion]
    inputs:
      requiredFiles: "wrangler.jsonc,src/index.ts,package.json"
    binding: bound
  - id: hook.webapp.health
    assay: webapp.health
    criteria: [C.webapp.health]
    tier: execution
    engine: http
    targetKind: runtime
    triggers: [deployment, outcome]
    inputs:
      path: /health
    timeoutMs: 2000
    binding: defined
  - id: hook.$thing.checks
    assay: webapp.checks
    criteria: [C.$thing.checks]
    tier: semantic
    engine: model-rules
    targetKind: model
    triggers: [submission]
    inputs:
      packs: "checks@1"
    binding: bound
