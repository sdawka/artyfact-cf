# A Cloudflare Worker that serves an API: endpoints, Durable Objects, Workflows, queues and the bindings they use.
id: template.thing.cloudflare-worker-service
version: 1
meta: 1
extends: template.meta.artyfact-genome@1
criteria:
  - id: C.service.checks
    owner: thing
    subject: thing
    severity: soft
    description: Changed nodes meet the checks their kinds declare.
    gates:
      - submission
    hooks:
      - hook.service.checks
kinds:
  endpoint:
    description: One HTTP route the Worker serves.
    parents: [section]
    fields:
      - {name: name, type: string, required: true}
      - {name: description, type: string, required: true}
      - {name: route, type: string, required: true}
      - {name: auth, type: string, required: true}
      - {name: request, type: string}
      - {name: response, type: string}
    completeness: {fields: [name, description, route, auth]}
    criteria:
      noun: endpoint
      instanceOf: An endpoint is one HTTP route that takes a request and returns a response.
      grounded: It names the method and path, who may call it and what it returns.
      testable: A testable endpoint names the request that triggers it and the status and body that would fail it.
    checks:
      - id: routeShape
        text: Its route is an HTTP method and an absolute path, such as GET /health.
        field: route
        pattern: "^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS) /\\S*$"
        level: error
      - id: authPrincipal
        text: Names the auth principal allowed to call it (anonymous, a user role or a service token) and what a caller without it receives.
        field: auth
        defect: specificity.underspecified
      - id: failureResponses
        text: States the status and body returned when the request is invalid or the dependency it needs fails.
        defect: specificity.underspecified
    view: {label: Endpoint, plural: Endpoints, glyph: "/", colour: blue, layer: experience, title: name, fields: [name, route, auth, description, request, response]}
  durable-object:
    description: A Durable Object class and what one instance of it owns.
    parents: [section]
    fields:
      - {name: name, type: string, required: true}
      - {name: description, type: string, required: true}
      - {name: className, type: string}
      - {name: key, type: string}
      - {name: storage, type: string}
    completeness: {fields: [name, description]}
    criteria:
      noun: Durable Object
      instanceOf: A Durable Object is a class whose instances each own private state and serialise access to it.
      grounded: It names what keys an instance and what state the instance owns.
    checks:
      - id: instanceKey
        text: Names what identifies one instance and the state that instance owns.
        defect: specificity.underspecified
    view: {label: Durable Object, plural: Durable Objects, glyph: "DO", colour: violet, layer: runtime, title: name, fields: [name, className, key, storage, description]}
  workflow:
    description: A Cloudflare Workflow, a durable multi-step process.
    parents: [section]
    fields:
      - {name: name, type: string, required: true}
      - {name: description, type: string, required: true}
      - {name: trigger, type: string}
      - {name: steps, type: list}
    completeness: {fields: [name, description]}
    criteria:
      noun: workflow
      instanceOf: A workflow is a durable process of named steps that survives restarts.
      grounded: It names what starts it, its steps in order and what happens when a step fails.
    checks:
      - id: stepFailure
        text: States what starts it and what happens to the run when a step fails after its retries.
        defect: specificity.underspecified
    view: {label: Workflow, plural: Workflows, glyph: "Wf", colour: amber, layer: runtime, title: name, fields: [name, trigger, steps, description]}
  queue:
    description: A Cloudflare Queue the Worker produces to or consumes from.
    parents: [section]
    fields:
      - {name: name, type: string, required: true}
      - {name: description, type: string, required: true}
      - {name: message, type: string}
      - {name: retry, type: string}
    completeness: {fields: [name, description]}
    criteria:
      noun: queue
      instanceOf: A queue carries messages from producers to a consumer.
      grounded: It names the message shape, the producer and the consumer.
    checks:
      - id: poisonMessage
        text: States the message shape and what the consumer does with a message that keeps failing.
        defect: specificity.underspecified
    view: {label: Queue, plural: Queues, glyph: "Q", colour: orange, layer: runtime, title: name, fields: [name, message, retry, description]}
  module:
    description: A cohesive piece of source code with one responsibility.
    parents: [section, module]
    fields:
      - {name: name, type: string, required: true}
      - {name: description, type: string, required: true}
      - {name: path, type: string}
    completeness: {fields: [name, description]}
    criteria:
      noun: module
      instanceOf: A module is a cohesive piece of source code with one responsibility.
      grounded: It names what it is responsible for and what it leaves to other modules.
    checks:
      - id: oneResponsibility
        text: States one responsibility, not a list of unrelated mechanisms.
        defect: instance.compound
      - id: pathShape
        text: Its path is repo-relative to the Thing root, with no leading slash or parent segments.
        field: path
        pattern: "^(?![/.])(?!.*\\.\\.)\\S+$"
        level: warning
    files: ["src/{slug}/**", "src/{slug}.ts", "worker/{slug}/**", "worker/{slug}.ts"]
    view: {label: Module, plural: Modules, glyph: "M", colour: teal, layer: domain, title: name, fields: [name, description, path]}
relations:
  dependsOn:
    description: The source needs the target to build or run; a Thing depends on another Thing, a module on another module. Redeclared so that module is an endpoint.
    from: [thing, module]
    to: [thing, module]
  exposes:
    description: The Thing offers the target as part of its public surface.
    from: [thing]
    to: [endpoint]
  calls:
    description: The source invokes the target at run time.
    from: [thing, module, endpoint, workflow, durable-object]
    to: [thing, endpoint, durable-object, workflow, queue, binding]
  deploys:
    description: The source ships the target to its runtime.
    from: [thing]
    to: [thing]
  implements:
    description: The module is the code that realises the target.
    from: [module]
    to: [endpoint, durable-object, workflow, queue]
  stepOperation:
    description: The journey step runs the target. Redeclared so that an endpoint can be a step's operation, beside the artyfact operation kind.
    from: [step]
    to: [operation, endpoint, workflow]
nodes:
  - id: template.thing.cloudflare-worker-service@1
    kind: template
    fields:
      kind: thing
      version: "1"
      name: Cloudflare Worker service
      description: "A Cloudflare Worker that serves an API: endpoints, Durable Objects, Workflows, queues and the bindings they use."
      sections:
        - section.api
        - section.runtime
        - section.state
        - section.modules
      criteria:
        - C.service.checks
      hooks:
        - hook.service.checks
  - {id: $self.api, kind: section, parent: $self, fields: {name: API, revision: 1, description: "The routes the Worker serves and who may call them.", fromTemplate: template.thing.cloudflare-worker-service@1}}
  - {id: $self.runtime, kind: section, parent: $self, fields: {name: Runtime, revision: 1, description: "Durable Objects, Workflows and queues the Worker runs.", fromTemplate: template.thing.cloudflare-worker-service@1}}
  - {id: $self.state, kind: section, parent: $self, fields: {name: State, revision: 1, description: "The bindings that hold the Worker's data and its secrets.", fromTemplate: template.thing.cloudflare-worker-service@1}, files: ["migrations/**"]}
  - {id: $self.modules, kind: section, parent: $self, fields: {name: Modules, revision: 1, description: "The source modules and what each is responsible for.", fromTemplate: template.thing.cloudflare-worker-service@1}, files: ["src/**", "worker/**"]}
  - id: C.service.checks
    kind: criterion
    fields:
      version: 1
      title: Changed nodes meet their checks
      claim: Changed nodes meet the checks their kinds declare.
      ownerKind: thing
      subjectKind: thing
      targetKind: model
      severity: soft
      gates:
        - submission
      deferred: false
      hooks:
        - hook.service.checks
      fromTemplate: template.thing.cloudflare-worker-service@1
    links:
      - rel: owner
        to: $self
      - rel: subject
        to: $self
  - id: hook.service.checks
    kind: hook
    fields:
      version: 1
      assay: service.checks
      criteria:
        - C.service.checks
      tier: semantic
      engine: model-rules
      targetKind: model
      triggers:
        - submission
      inputs:
        packs: checks@1
      timeoutMs: 60000
      costTier: free
      binding: bound
      fromTemplate: template.thing.cloudflare-worker-service@1
files:
  - "{package.json,package-lock.json,tsconfig.json,vitest.config.ts,wrangler.jsonc,wrangler.json,wrangler.toml,.gitignore,README.md}"
  - "test/**"