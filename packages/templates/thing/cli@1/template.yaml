# A command-line tool: its commands and options, and the modules behind them.
id: template.thing.cli
version: 1
meta: 1
extends: template.meta.artyfact-genome@1
criteria:
  - id: C.$self.checks
    owner: thing
    subject: thing
    severity: soft
    description: Changed nodes meet the checks their kinds declare.
    gates:
      - submission
    hooks:
      - hook.$self.checks
kinds:
  command:
    description: One command or subcommand the tool runs.
    parents: [section, command]
    fields:
      - {name: name, type: string, required: true}
      - {name: description, type: string, required: true}
      - {name: usage, type: string, required: true}
      - {name: exitCodes, type: string}
    completeness: {fields: [name, description, usage]}
    criteria:
      noun: command
      instanceOf: A command is one action the tool runs from the command line, with arguments and an exit status.
      grounded: It names its usage, what it does and the exit status that means failure.
      testable: A testable command names an invocation and the output or exit status that would fail it.
    checks:
      - id: documented
        text: Documents what the command does, its arguments and the exit status that signals failure.
        defect: specificity.underspecified
      - id: usageShape
        text: Its usage starts with the command name, followed by its arguments.
        field: usage
        pattern: "^[a-z][\\w-]*(\\s|$)"
        level: warning
    view: {label: Command, plural: Commands, glyph: "$", colour: green, layer: experience, title: name, fields: [name, usage, exitCodes, description]}
  option:
    description: One flag or argument of a command.
    parents: [command]
    fields:
      - {name: name, type: string, required: true}
      - {name: description, type: string, required: true}
      - {name: flag, type: string, required: true}
      - {name: valueType, type: string, enum: [boolean, string, number, path, choice]}
      - {name: default, type: string}
    completeness: {fields: [name, description, flag]}
    criteria:
      noun: option
      instanceOf: An option is one flag or argument that changes how a command runs.
      grounded: It names its flag, its value and what changes when it is set.
    checks:
      - id: flagShape
        text: Its flag is a short flag, a long flag or both, such as -v or --verbose.
        field: flag
        pattern: "^(-[A-Za-z]|--[a-z][a-z0-9-]*)([ ,=].*)?$"
        level: error
      - id: effectStated
        text: States its default and what changes when it is set.
        defect: specificity.underspecified
    view: {label: Option, plural: Options, glyph: "--", colour: teal, layer: experience, title: name, fields: [name, flag, valueType, default, description]}
  module:
    description: A cohesive piece of source code with one responsibility.
    parents: [section, module]
    fields:
      - {name: name, type: string, required: true}
      - {name: description, type: string, required: true}
      - {name: path, type: string}
    completeness: {fields: [name, description]}
    criteria:
      noun: module
      instanceOf: A module is a cohesive piece of source code with one responsibility.
      grounded: It names what it is responsible for and what it leaves to other modules.
    checks:
      - id: oneResponsibility
        text: States one responsibility, not a list of unrelated mechanisms.
        defect: instance.compound
      - id: pathShape
        text: Its path is repo-relative to the Thing root, with no leading slash or parent segments.
        field: path
        pattern: "^(?![/.])(?!.*\\.\\.)\\S+$"
        level: warning
    files: ["src/{slug}/**", "src/{slug}.ts", "worker/{slug}/**", "worker/{slug}.ts"]
    view: {label: Module, plural: Modules, glyph: "M", colour: teal, layer: domain, title: name, fields: [name, description, path]}
relations:
  dependsOn:
    description: The source needs the target to build or run; a Thing depends on another Thing, a module on another module. Redeclared so that module is an endpoint.
    from: [thing, module]
    to: [thing, module]
  exposes:
    description: The Thing offers the target as part of its public surface.
    from: [thing]
    to: [command]
  calls:
    description: The source invokes the target at run time.
    from: [thing, module, command]
    to: [thing, command]
  deploys:
    description: The source ships the target to its runtime.
    from: [thing]
    to: [thing]
  implements:
    description: The module is the code that realises the target.
    from: [module]
    to: [command, option]
  stepOperation:
    description: The journey step runs the target. Redeclared so that a command can be a step's operation, beside the artyfact operation kind.
    from: [step]
    to: [operation, command]
  affects:
    description: The Evolution changes the target. Redeclared so that a command, option or module can be affected.
    from: [evolution]
    to: [command, option, module]
nodes:
  - id: template.thing.cli@1
    kind: template
    fields:
      kind: thing
      version: "1"
      name: Command-line tool
      description: "A command-line tool: its commands and options, and the modules behind them."
      sections:
        - $self.commands
        - $self.modules
      criteria:
        - C.$self.checks
      hooks:
        - hook.$self.checks
  - {id: $self.commands, kind: section, parent: $self, fields: {name: Commands, revision: 1, description: "The commands the tool runs and their options.", fromTemplate: template.thing.cli@1}, files: ["bin/**"]}
  - {id: $self.modules, kind: section, parent: $self, fields: {name: Modules, revision: 1, description: "The source modules and what each is responsible for.", fromTemplate: template.thing.cli@1}, files: ["src/**"]}
  - id: C.$self.checks
    kind: criterion
    fields:
      version: 1
      title: Changed nodes meet their checks
      claim: Changed nodes meet the checks their kinds declare.
      ownerKind: thing
      subjectKind: thing
      targetKind: model
      severity: soft
      gates:
        - submission
      deferred: false
      hooks:
        - hook.$self.checks
      fromTemplate: template.thing.cli@1
    links:
      - rel: owner
        to: $self
      - rel: subject
        to: $self
  - id: hook.$self.checks
    kind: hook
    fields:
      version: 1
      assay: cli.checks
      criteria:
        - C.$self.checks
      tier: semantic
      engine: model-rules
      targetKind: model
      triggers:
        - submission
      inputs:
        packs: checks@1
      timeoutMs: 60000
      costTier: free
      binding: bound
      fromTemplate: template.thing.cli@1
files:
  - "{package.json,package-lock.json,tsconfig.json,vitest.config.ts,.gitignore,README.md}"
  - "test/**"