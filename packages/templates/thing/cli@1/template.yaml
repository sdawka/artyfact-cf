# A command-line tool: its commands and options, and the modules behind them.
id: template.thing.cli
version: 1
meta: 1
kinds:
  system:
    description: The software system as a whole.
    fields:
      - {name: title, type: string, required: true}
      - {name: description, type: string, required: true}
      - {name: narrative, type: string}
      - {name: alternatives, type: list}
      - {name: openQuestions, type: list}
    completeness: {fields: [title, description]}
    criteria:
      noun: system
      instanceOf: A system is a set of Things that together serve one purpose.
      grounded: It names the purpose it serves and what each of its Things is for.
    view: {label: System, plural: Systems, glyph: "Sy", colour: indigo, layer: system, fields: [title, description, narrative, alternatives, openQuestions]}
  thing:
    description: One deployable or publishable unit of the system, built from one template.
    parents: [system]
    fields:
      - {name: title, type: string, required: true}
      - {name: description, type: string, required: true}
      - {name: purposeRefs, type: refs}
    completeness: {fields: [title, description]}
    criteria:
      noun: thing
      instanceOf: A Thing is one deployable or publishable unit with a single owner and a single build.
      grounded: It names what it provides to the rest of the system.
    view: {label: Thing, plural: Things, glyph: "Th", colour: indigo, layer: thing, fields: [title, description, purposeRefs]}
  section:
    description: Groups the nodes of one area of a Thing or of the System.
    parents: [system, thing]
    fields:
      - {name: title, type: string, required: true}
      - {name: description, type: string}
    criteria:
      noun: section
      instanceOf: A section groups the items of one area.
      tangible: false
    view: {label: Section, plural: Sections, glyph: "§", colour: slate}
  command:
    description: One command or subcommand the tool runs.
    parents: [section, command]
    fields:
      - {name: title, type: string, required: true}
      - {name: description, type: string, required: true}
      - {name: usage, type: string, required: true}
      - {name: exitCodes, type: string}
    completeness: {fields: [title, description, usage]}
    criteria:
      noun: command
      instanceOf: A command is one action the tool runs from the command line, with arguments and an exit status.
      grounded: It names its usage, what it does and the exit status that means failure.
      testable: A testable command names an invocation and the output or exit status that would fail it.
    checks:
      - id: documented
        text: Documents what the command does, its arguments and the exit status that signals failure.
        defect: specificity.underspecified
      - id: usageShape
        text: Its usage starts with the command name, followed by its arguments.
        field: usage
        pattern: "^[a-z][\\w-]*(\\s|$)"
        level: warning
    view: {label: Command, plural: Commands, glyph: "$", colour: green, layer: surface, fields: [title, usage, exitCodes, description]}
  option:
    description: One flag or argument of a command.
    parents: [command]
    fields:
      - {name: title, type: string, required: true}
      - {name: description, type: string, required: true}
      - {name: flag, type: string, required: true}
      - {name: valueType, type: string, enum: [boolean, string, number, path, choice]}
      - {name: default, type: string}
    completeness: {fields: [title, description, flag]}
    criteria:
      noun: option
      instanceOf: An option is one flag or argument that changes how a command runs.
      grounded: It names its flag, its value and what changes when it is set.
    checks:
      - id: flagShape
        text: Its flag is a short flag, a long flag or both, such as -v or --verbose.
        field: flag
        pattern: "^(-[A-Za-z]|--[a-z][a-z0-9-]*)([ ,=].*)?$"
        level: error
      - id: effectStated
        text: States its default and what changes when it is set.
        defect: specificity.underspecified
    view: {label: Option, plural: Options, glyph: "--", colour: teal, layer: surface, fields: [title, flag, valueType, default, description]}
  module:
    description: A cohesive piece of source code with one responsibility.
    parents: [section, module]
    fields:
      - {name: title, type: string, required: true}
      - {name: description, type: string, required: true}
      - {name: path, type: string}
    completeness: {fields: [title, description]}
    criteria:
      noun: module
      instanceOf: A module is a cohesive piece of source code with one responsibility.
      grounded: It names what it is responsible for and what it leaves to other modules.
    checks:
      - id: oneResponsibility
        text: States one responsibility, not a list of unrelated mechanisms.
        defect: instance.compound
      - id: pathShape
        text: Its path is repo-relative to the Thing root, with no leading slash or parent segments.
        field: path
        pattern: "^(?![/.])(?!.*\\.\\.)\\S+$"
        level: warning
    files: ["src/{slug}/**", "src/{slug}.ts", "worker/{slug}/**", "worker/{slug}.ts"]
    view: {label: Module, plural: Modules, glyph: "M", colour: teal, layer: code, fields: [title, description, path]}
relations:
  dependsOn:
    description: The source needs the target to build or run; a Thing depends on another Thing, a module on another module.
    from: [thing, module]
    to: [thing, module]
  exposes:
    description: The Thing offers the target as part of its public surface.
    from: [thing]
    to: [command]
  calls:
    description: The source invokes the target at run time.
    from: [thing, module, command]
    to: [thing, command]
  deploys:
    description: The source ships the target to its runtime.
    from: [thing]
    to: [thing]
  implements:
    description: The module is the code that realises the target.
    from: [module]
    to: [command, option]
nodes:
  - {id: $self.commands, kind: section, parent: $self, fields: {title: Commands, description: "The commands the tool runs and their options."}, files: ["bin/**"]}
  - {id: $self.modules, kind: section, parent: $self, fields: {title: Modules, description: "The source modules and what each is responsible for."}, files: ["src/**"]}
files:
  - "{package.json,package-lock.json,tsconfig.json,vitest.config.ts,.gitignore,README.md}"
  - "test/**"
view:
  layers:
    - {id: system, label: System, description: "The system as a whole."}
    - {id: thing, label: Things, description: "The deployable units."}
    - {id: surface, label: Surface, description: "What a person types."}
    - {id: code, label: Code, description: "The modules that realise the commands."}
