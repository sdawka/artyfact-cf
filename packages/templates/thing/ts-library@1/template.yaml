# A TypeScript package other Things import: its public exports and the modules behind them.
id: template.thing.ts-library
version: 1
meta: 1
extends: template.meta.artyfact-genome@1
criteria:
  - id: C.$self.checks
    owner: thing
    subject: thing
    severity: soft
    description: Changed nodes meet the checks their kinds declare.
    gates:
      - submission
    hooks:
      - hook.$self.checks
kinds:
  export:
    description: One name the package makes public.
    parents: [section, module]
    fields:
      - {name: name, type: string, required: true}
      - {name: description, type: string, required: true}
      - {name: signature, type: string, required: true}
      - {name: stability, type: string, enum: [stable, experimental, deprecated]}
    completeness: {fields: [name, description, signature]}
    criteria:
      noun: export
      instanceOf: An export is one function, class, type or constant the package makes public.
      grounded: It names its signature, what it returns and when it fails.
      testable: A testable export names an input and the result or error that would fail it.
    checks:
      - id: documented
        text: Documents what it takes, what it returns and what it throws.
        defect: specificity.underspecified
      - id: signatureShape
        text: Its signature starts with a declaration keyword and names the export.
        field: signature
        pattern: "^(export\\s+)?(async\\s+)?(function|class|const|type|interface|enum)\\s+\\w+"
        level: warning
    view: {label: Export, plural: Exports, glyph: "Ex", colour: blue, layer: experience, title: name, fields: [name, signature, stability, description]}
  module:
    description: A cohesive piece of source code with one responsibility.
    parents: [section, module]
    fields:
      - {name: name, type: string, required: true}
      - {name: description, type: string, required: true}
      - {name: path, type: string}
    completeness: {fields: [name, description]}
    criteria:
      noun: module
      instanceOf: A module is a cohesive piece of source code with one responsibility.
      grounded: It names what it is responsible for and what it leaves to other modules.
    checks:
      - id: oneResponsibility
        text: States one responsibility, not a list of unrelated mechanisms.
        defect: instance.compound
      - id: pathShape
        text: Its path is repo-relative to the Thing root, with no leading slash or parent segments.
        field: path
        pattern: "^(?![/.])(?!.*\\.\\.)\\S+$"
        level: warning
    files: ["src/{slug}/**", "src/{slug}.ts", "worker/{slug}/**", "worker/{slug}.ts"]
    view: {label: Module, plural: Modules, glyph: "M", colour: teal, layer: domain, title: name, fields: [name, description, path]}
relations:
  dependsOn:
    description: The source needs the target to build or run; a Thing depends on another Thing, a module on another module. Redeclared so that module is an endpoint.
    from: [thing, module]
    to: [thing, module]
  exposes:
    description: The Thing offers the target as part of its public surface.
    from: [thing]
    to: [export]
  calls:
    description: The source invokes the target at run time.
    from: [thing, module]
    to: [thing]
  deploys:
    description: The source ships the target to its runtime.
    from: [thing]
    to: [thing]
  implements:
    description: The module is the code that realises the target.
    from: [module]
    to: [export]
nodes:
  - id: template.thing.ts-library@1
    kind: template
    fields:
      kind: thing
      version: "1"
      name: TypeScript library
      description: "A TypeScript package other Things import: its public exports and the modules behind them."
      sections:
        - section.api
        - section.modules
      criteria:
        - C.$self.checks
      hooks:
        - hook.$self.checks
  - {id: $self.api, kind: section, parent: $self, fields: {name: API, revision: 1, description: "The names the package exports and how callers use them.", fromTemplate: template.thing.ts-library@1}}
  - {id: $self.modules, kind: section, parent: $self, fields: {name: Modules, revision: 1, description: "The source modules and what each is responsible for.", fromTemplate: template.thing.ts-library@1}, files: ["src/**"]}
  - id: C.$self.checks
    kind: criterion
    fields:
      version: 1
      title: Changed nodes meet their checks
      claim: Changed nodes meet the checks their kinds declare.
      ownerKind: thing
      subjectKind: thing
      targetKind: model
      severity: soft
      gates:
        - submission
      deferred: false
      hooks:
        - hook.$self.checks
      fromTemplate: template.thing.ts-library@1
    links:
      - rel: owner
        to: $self
      - rel: subject
        to: $self
  - id: hook.$self.checks
    kind: hook
    fields:
      version: 1
      assay: library.checks
      criteria:
        - C.$self.checks
      tier: semantic
      engine: model-rules
      targetKind: model
      triggers:
        - submission
      inputs:
        packs: checks@1
      timeoutMs: 60000
      costTier: free
      binding: bound
      fromTemplate: template.thing.ts-library@1
files:
  - "{package.json,package-lock.json,tsconfig.json,tsconfig.build.json,vitest.config.ts,.gitignore,README.md}"
  - "test/**"