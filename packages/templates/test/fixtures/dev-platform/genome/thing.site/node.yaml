id: thing.site
kind: thing
template: template.thing.static-site@1
root: apps/site
fields:
  name: Status site
  description: The public page that shows the health of the API.
links:
  - {rel: artifact, to: artifact.site}
  - {rel: exposes, to: page.status}
criteria:
  - id: C.thing.site.checks
    title: Changed nodes meet their checks
    claim: Changed nodes meet the checks their kinds declare.
    severity: soft
    gates:
      - submission
    hooks:
      - id: hook.thing.site.checks
        assay: site.checks
        tier: semantic
        engine: model-rules
        triggers:
          - submission
        inputs:
          packs: checks@1
        binding: bound
        fromTemplate: template.thing.static-site@1
    fromTemplate: template.thing.static-site@1
