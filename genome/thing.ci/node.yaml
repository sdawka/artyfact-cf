id: thing.ci
kind: thing
template: template.thing.cloudflare-worker-service@1
root: apps/ci
fields:
  name: CI
  description: "The artyfact-ci Worker: the ArtyfactCI Workflow on @cloudflare/ci builds and deploys app commits in a container sandbox and reports each build back to the platform. A separate ArtyfactVerification Workflow tests exact self-development source and pinned hooks without deployment credentials, and retains immutable output for local approval and activation."
links:
  - { rel: artifact, to: artifact.ci }
  - { rel: dependsOn, to: thing.model }
  - { rel: exposes, to: endpoint.ci-health }
  - { rel: calls, to: endpoint.report-build }
  - { rel: calls, to: endpoint.report-realization-build }
files:
  - Dockerfile
criteria:
  - id: C.ci.pipeline
    title: The pipeline runs only allowed commands and never exposes credentials
    claim: A build runs install, test, build, bundle and deploy from the allowlist; the deploy step holds the only credentials and runs no repo script.
    target: artifact
    gates:
      - candidate
      - promotion
    hooks:
      - id: hook.ci.pipeline
        assay: ci.pipeline
        tier: execution
        engine: vitest
        triggers:
          - candidate
          - promotion
        inputs:
          command: npm test -w @artyfact/ci
  - id: C.thing.ci.checks
    title: Changed nodes meet their checks
    claim: Changed nodes meet the checks their kinds declare.
    severity: soft
    gates:
      - submission
    hooks:
      - id: hook.thing.ci.checks
        assay: ci.checks
        tier: semantic
        engine: model-rules
        triggers:
          - submission
        inputs:
          packs: checks@1
        binding: bound
        fromTemplate: template.thing.cloudflare-worker-service@1
    fromTemplate: template.thing.cloudflare-worker-service@1
