id: thing.semantic
kind: thing
template: template.thing.ts-library@1
root: packages/semantic
fields:
  name: Semantic
  description: "@artyfact/semantic: the question builders, policy and judgments the hooks ask System One, on the ontology engine's System One client."
links:
  - { rel: artifact, to: artifact.semantic }
  - { rel: dependsOn, to: thing.ontology }
  - { rel: exposes, to: export.semantic.create }
  - { rel: exposes, to: export.semantic.interference }
  - { rel: exposes, to: export.semantic.verdict }
criteria:
  - id: C.semantic.unit
    title: "@artyfact/semantic tests pass"
    claim: Provider, policy, question and judgment suites pass with the fake provider.
    target: artifact
    gates:
      - candidate
      - promotion
    hooks:
      - id: hook.semantic.unit
        assay: semantic.unit
        tier: execution
        engine: vitest
        triggers:
          - candidate
          - promotion
        inputs:
          command: pnpm --filter @artyfact/semantic test
  - id: C.thing.semantic.checks
    title: Changed nodes meet their checks
    claim: Changed nodes meet the checks their kinds declare.
    severity: soft
    gates:
      - submission
    hooks:
      - id: hook.thing.semantic.checks
        assay: semantic.checks
        tier: semantic
        engine: model-rules
        triggers:
          - submission
        inputs:
          packs: checks@1
        binding: bound
        fromTemplate: template.thing.ts-library@1
    fromTemplate: template.thing.ts-library@1
