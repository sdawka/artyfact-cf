id: component.theory.signifiers
kind: component
fields:
  name: Claim signifiers
  description: Each claim's status as glyph plus word; supported is never green because a claim is a hypothesis.
  states:
    - ○ unknown (subtle)
    - ◐ inconclusive (subtle)
    - ● supported (subtle)
    - ✕ challenged (danger)
    - deferred (subtle)
