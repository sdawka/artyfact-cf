id: screen.theory
kind: screen
fields:
  name: Theory
  description: "Why the System should work: hypotheses, not a validated causal model. The header status counts claims, unknowns and theory gaps. Purpose with its success criteria, then Claims as a list by default (each row the chain Beneficiaries → Activities → Outputs → Outcomes with its indicator and an Evaluation method disclosure) or, at 1280px and wider, the five-column grid. Theory gaps lists the theory and purpose findings when there are any."
  route: /s/:systemId/r/:rev/theory
  states:
    - loading
    - loaded
    - "empty: No claims yet."
    - error
