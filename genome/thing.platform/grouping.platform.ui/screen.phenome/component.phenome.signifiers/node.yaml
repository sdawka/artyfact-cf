id: component.phenome.signifiers
kind: component
fields:
  name: Deploy signifiers
  description: "Per build and deployment: status, kind, commit and the System commit it runs, as glyph plus word. Only a passed build is green; a missing value reads literally unknown."
  states:
    - Live at <url> (subtle)
    - Last production deploy failed (danger)
    - not deployed (subtle)
    - ✓ build passed (success)
    - × build failed (danger)
    - "! build error (danger)"
    - … build running (subtle)
    - · build queued (subtle)
    - deployed (subtle)
    - deploying (subtle)
    - × deploy failed (danger)
    - unknown (subtle)
