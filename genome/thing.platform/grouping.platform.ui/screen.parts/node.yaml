id: screen.parts
kind: screen
fields:
  name: Private Parts
  description: "Packages that stay inside the System; reading them needs a token. A panel, Read private Parts, takes Admin token or realization secret (kept in memory only, never the header token) with the primary Load private Parts. Once loaded it reads Token loaded. with Change, and the Parts show as a list and detail (name, version, short digest, time; the first opens). Parts are published from the CLI or an agent; there is no publish form."
  route: /s/:systemId/r/:rev/parts
  states:
    - token needed
    - "loading: Loading private Parts…"
    - loaded
    - "empty: No private Parts in this System."
    - "error: This token is not authorized to read private Parts in this System."
    - "error: Could not load private Parts."
links:
  - rel: serves
    to: feature.parts
