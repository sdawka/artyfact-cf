id: affordance.compare.open-file-diff
kind: affordance
fields:
  name: Open file diff
  description: Opens one file's diff.
  actor: user
  trigger: click
  preconditions:
    - The file changed
  effects:
    - The diff opens beside the list
  failure:
    - "Binary or large file: a notice replaces the diff"
links:
