id: screen.compare
kind: screen
fields:
  name: Compare
  description: "Two revisions side by side at the System, Genome or file level. Off the rail: reached with g x, the palette or Changelog's Compare with parent. The header holds Compare <From> ⇄ <To>; the default pair is the previous commit against head. Tabs System, Genome and Files carry counts. System opens with a sentence derived from the changed rows and hides unchanged rows behind Show n unchanged; Files lists App and Genome changes with a legend and a line diff with Open in Code."
  route: /s/:systemId/r/:rev/compare
  states:
    - "loading: Comparing <from> with <to>…"
    - loaded
    - "same: Nothing differs between these revisions."
    - "error: Could not compare these revisions."
    - "fixture: Compare needs the platform API."
