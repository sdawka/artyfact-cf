id: affordance.work.accept-ops
kind: affordance
fields:
  name: Accept
  description: Accepts the ops to keep and commits the node updates. Calls POST /api/systems/:id/intents/:pid/accept.
  actor: user
  trigger: click
  preconditions:
    - A proposal is shown
    - An admin token is set
  effects:
    - A candidate and an Evolution open and are linked
  failure:
    - "409: the stale message is shown"
