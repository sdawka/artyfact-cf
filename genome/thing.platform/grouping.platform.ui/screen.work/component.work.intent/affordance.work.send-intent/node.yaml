id: affordance.work.send-intent
kind: affordance
fields:
  name: Propose changes
  description: Sends the change text, optionally anchored on a node.
  actor: user
  trigger: click
  preconditions:
    - The text is not empty (otherwise Describe the change first.)
  effects:
    - A proposal or a question appears
  failure:
    - "Error: the message is shown and the text is kept"
links:
  - rel: invokes
    to: endpoint.intents-create
