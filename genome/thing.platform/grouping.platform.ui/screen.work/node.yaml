id: screen.work
kind: screen
fields:
  name: Work
  description: Evolutions on a board with their realizations, the task packet and start-work. Actionable targets wear corner brackets and the page has one primary button, and Start work is the one primary action on an Evolution; acting shows the new realization or an inline error, and Describe a change replaces the list and detail with its panel until Back to Work.
  route: /s/:systemId/r/:rev/work
  states:
    - loading
    - loaded
    - empty
    - error
    - describe-a-change panel open
    - fake provider
links:
  - rel: serves
    to: feature.agent-realization
  - rel: serves
    to: feature.describe-change
