id: component.work.build-chip
kind: component
fields:
  name: Build chip
  description: The build of an attempt as glyph plus build <status>, with a Preview link. Only a passed build is green; a missing value reads literally unknown.
  states:
    - ✓ build passed (success)
    - × build failed (danger)
    - "! build error (danger)"
    - … build running (subtle)
    - · build queued (subtle)
    - "? build unknown (subtle)"
