id: component.work.signifiers
kind: component
fields:
  name: Attempt signifiers
  description: "On the Evolution detail, per attempt: agent, role, target and status, the fork with its checkpoint (or literally unknown), a token countdown that turns attention under 30 minutes, the build and the changed subjects. Verdicts are glyph plus word; only pass is green."
  states:
    - ◑ running (subtle)
    - submitted (attention)
    - evaluated (attention)
    - awaiting-admin (attention)
    - promoted (subtle)
    - rejected (danger)
    - fork + checkpoint (subtle)
    - checkpoint unknown (subtle)
    - token expires in 12 min 03 s (attention)
    - token expired (danger)
