id: screen.part
kind: screen
fields:
  name: Part
  description: "A shared Part version, read-only. The scope line reads Home / Shared Parts / <name>; the h1 is the Part's name with its description. A meta line shows id@version with Copy, pinned, published and the digest with Copy digest, then Dependencies and inputs, Payload (files or Genome nodes, each expandable, and View raw JSON) and Saved commands, which this page does not run. Parts are authored and upgraded with the CLI or an agent."
  route: /parts/:partId/:version
  states:
    - "loading: Loading Part…"
    - loaded
    - "not found: Part not found"
    - "error: This Part could not be loaded."
links:
  - rel: serves
    to: feature.parts
