id: affordance.code.edit
kind: affordance
fields:
  name: Edit
  description: Makes the open file editable as a local draft on head; Discard and Delete file also change only the draft.
  actor: user
  trigger: click
  preconditions:
    - A file is open
    - The revision is head
  effects:
    - The pane becomes an editor and the file joins the pending well
  failure:
    - "Not head: Editing works on head; this is <rev>."
