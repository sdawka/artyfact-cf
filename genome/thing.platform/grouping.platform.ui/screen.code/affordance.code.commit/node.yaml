id: affordance.code.commit
kind: affordance
fields:
  name: Commit…
  description: Commits the edit to the realization's fork. Calls POST /api/systems/:id/realizations/:rid/commit.
  actor: user
  trigger: click
  preconditions:
    - The file was edited
    - An admin token is set
  effects:
    - A commit is made and the pane shows the new head
  failure:
    - "409: the stale message is shown and the edit is kept"
