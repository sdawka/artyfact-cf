id: screen.code
kind: screen
fields:
  name: Code
  description: "Genome and app source at any revision. Header: + New file (secondary) and the primary Commit changes, disabled with Nothing to commit. Edit a file first. until something is pending. A toolbar holds the Repository tabs (Genome, App) and the editing state; the pending well lists drafts with Discard. A file list and file pane share a list and detail (Back to files below 900px); the tree opens on the selected path. Commit replaces the file region as a panel (Back to file). The revision comes from the top bar; the header admin token is the only token."
  route: /s/:systemId/r/:rev/code
  states:
    - "loading: Loading files…"
    - loaded
    - "error: Could not list files"
    - "no file selected: Pick a file to read it at <rev>."
    - "not found: No file at <path> in this revision."
    - binary or too large
    - commit panel open
