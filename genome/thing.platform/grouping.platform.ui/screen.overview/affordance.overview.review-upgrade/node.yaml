id: affordance.overview.review-upgrade
kind: affordance
fields:
  name: Review upgrade
  description: Reads the pending template upgrade and offers to apply it. Calls GET /api/systems/:id/template-upgrade.
  actor: user
  trigger: click
  preconditions:
    - A newer template version exists
  effects:
    - The upgrade diff is shown for review
  failure:
    - A rules violation or stale head is reported inline
