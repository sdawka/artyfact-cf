id: component.overview.signifiers
kind: component
fields:
  name: System light
  description: The System light reflects readiness, checks, active work and blockers, with its facts beside it (Readiness, Failing or stale checks, Active Evolutions, Blockers, Light). The light always pairs with a word; only a passing state is green and a missing value reads literally unknown.
  states:
    - ● healthy (success)
    - attention (attention)
    - failing (danger)
    - unknown (subtle)
