id: screen.overview
kind: screen
fields:
  name: Overview
  description: "The System at a glance. The h1 is the System name and the purpose its first Purpose statement; the one primary is Describe a change. Below the System light: Needs you rows (hidden when nothing waits), the three states side by side, Active Evolutions, Blockers and warnings, a Facts strip (Phase, Head, Genome commit, Deployment, App template) and Purpose in full, collapsed."
  route: /s/:systemId/r/:rev/overview
  states:
    - loading
    - loaded
    - error
    - fixture data
    - template upgrade panel open
