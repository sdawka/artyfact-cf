id: screen.journeys
kind: screen
fields:
  name: Journeys
  description: "How people and services move through the System. A catalog of journeys (the current row marked; deferred ones collapsed under Deferred (n); a Journey select below 900px) beside the stage: the journey's name and goal, Fit and 100%, Segment tabs when it has segments, and a lane canvas (Actor, System, External) with a legend and a Steps (n) list, open by default on narrow screens. No header actions."
  route: /s/:systemId/r/:rev/journeys
  states:
    - loading
    - loaded
    - "empty: No journeys yet."
    - error
