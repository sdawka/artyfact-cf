id: affordance.journeys.open-step-screen
kind: affordance
fields:
  name: Open screen
  description: A step's screen link opens the screen it happens on.
  actor: user
  trigger: click
  preconditions:
    - The step names a screen
  effects:
    - The screen opens
  failure:
    - "The screen no longer exists: the link is shown unresolved"
links:
  - rel: references
    to: screen.work
