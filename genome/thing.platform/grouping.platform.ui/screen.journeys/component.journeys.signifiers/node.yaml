id: component.journeys.signifiers
kind: component
fields:
  name: Step signifiers
  description: Each step shows its actor and a mark for its kind; failure paths are dashed and labelled, provisional steps dotted with a question mark.
  states:
    - User, System, External or Counterpart (subtle)
    - ⧖ wait (subtle)
    - ◇ decision (subtle)
    - ↩ reaction (subtle)
    - ■ end (subtle)
    - ✕ failure (danger)
    - provisional ? (subtle, dotted)
    - deferred (subtle)
