id: component.map.signifiers
kind: component
fields:
  name: Map signifiers
  description: "The map key (declared, assumed, proposed, outside System, candidate touches), the Overlay choice, the candidate halo with its overlap chip, Proteome realization counts and Phenome evidence counts. Selection is shown by the rule, weight and status glow, never resting glow; edge certainty is the dash pattern, not colour; only pass is green."
  states:
    - "Overlay: Genome, Proteome, Phenome (subtle)"
    - declared edge (solid, subtle)
    - assumed or proposed edge (dashed, subtle)
    - outside System (subtle)
    - Overlap, n candidates (attention)
    - ⎇ n realizations (subtle)
    - ✓ n pass (success)
    - ✕ n fail (danger)
    - unknown, stale, not run (subtle)
    - No evidence yet (subtle)
