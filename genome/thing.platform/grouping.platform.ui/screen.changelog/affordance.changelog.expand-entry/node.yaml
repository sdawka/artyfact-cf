id: affordance.changelog.expand-entry
kind: affordance
fields:
  name: Expand
  description: The whole row toggles its entry; several can be open. ?commit= opens and marks one.
  actor: user
  trigger: click
  preconditions: []
  effects:
    - The entry opens under the row
  failure:
    - "Error: Could not load this commit's detail. with Retry"
links:
  - rel: invokes
    to: endpoint.changelog-entry
