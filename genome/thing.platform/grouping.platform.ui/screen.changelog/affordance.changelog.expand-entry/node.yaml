id: affordance.changelog.expand-entry
kind: affordance
fields:
  name: Expand
  description: Loads one commit's entry with its changed files and node delta. Calls GET /api/systems/:id/changelog/:commitId.
  actor: user
  trigger: click
  preconditions: []
  effects:
    - The entry opens under the row
  failure:
    - "Error: the row shows the message with Retry"
