id: affordance.shell.set-admin-token
kind: affordance
fields:
  name: Admin token
  description: The one place to set the admin token. A popover (a dialog on compact screens, or Admin token… in the More menu and the palette) with the field Token for admin actions, Save and Forget; the token is kept for this browser tab's session and every admin write reads it. Writes without it are disabled with the visible reason Set the admin token in the header.
  actor: user
  trigger: click
  preconditions: []
  effects:
    - The button reads Admin with a set status and admin writes enable
  failure:
    - "Wrong token: admin actions answer 403 and say so inline"
