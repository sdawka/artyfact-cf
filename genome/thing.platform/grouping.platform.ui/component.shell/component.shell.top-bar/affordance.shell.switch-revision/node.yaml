id: affordance.shell.switch-revision
kind: affordance
fields:
  name: Switch System or revision
  description: The System and Revision selects in the top bar move the workspace to another System or revision and keep the current view.
  actor: user
  trigger: click
  preconditions:
    - The System has revisions
  effects:
    - Every view reloads on the chosen revision
  failure:
    - "Unknown revision: the route error page"
links:
  - rel: invokes
    to: endpoint.revisions
