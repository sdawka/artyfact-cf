id: component.shell.side-nav
kind: component
fields:
  name: Side navigation
  description: "The rail, labelled Views: inside a Thing a scope row In <Thing> with Leave comes first; then Map and Overview, then Genome, Proteome and Phenome heads, each with its question as a subline (What should it be, What is being made, What does it do), then Private Parts. Journeys and Theory show only when the templates declare them; Compare is not on the rail. The current row carries the selection rule; nothing glows at rest. Review counts the decisions waiting (Review, n waiting) and Work the tasks ready for an agent (Work, n ready for an agent); both hide at zero. Below 1024px the rail is a Menu sheet."
  states:
    - Map
    - Overview
    - "Genome: Journeys, Theory, Code"
    - "Proteome: Work, Review, Evaluations, Changelog"
    - "Phenome: Deployments"
    - Private Parts
    - In <Thing> · Leave
    - Review count (attention)
    - Work count (attention)
    - collapsed on narrow screens
