id: component.shell.inspector.evidence
kind: component
fields:
  name: Evidence
  description: The evaluations of the criteria on the node, as a compact table with the kind glyph hidden in verdict rows; the tab shows the count. With none it says how many criteria apply and links Open Evaluations.
  states:
    - loaded
    - "empty: No evaluations yet."
    - ✓ pass (success)
    - × fail (danger)
    - unknown (subtle)
    - not run (subtle)
    - stale (subtle, dashed)
