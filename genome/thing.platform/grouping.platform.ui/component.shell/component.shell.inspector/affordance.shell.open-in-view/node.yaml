id: affordance.shell.open-in-view
kind: affordance
fields:
  name: Open in
  description: "Text links after Open in: Map, Journeys, Theory, Work and Code (when the node has a source document); the current view is never offered."
  actor: user
  trigger: click
  preconditions:
    - A node is focused
  effects:
    - The view opens focused on the node
  failure: []
