id: component.shell.command-palette
kind: component
fields:
  name: Go to
  description: "A dialog named Go to with the search Go to a view, node or action…. Groups: Views (rail order then Compare, each with its g key, Review with its waiting count), Nodes (top 50, kind glyph, name and id) and Actions (Describe a change, anchored to the focused node when there is one; Admin token…; Retry API with fixture data only; Effects: turn on or off). A footer shows the keys: ↑ ↓ move, Enter open, Esc close, and [ ] siblings when a node is focused."
  states:
    - closed
    - open
    - "empty: Nothing matches “q”. Try a name or an id such as thing.webapp."
    - "empty: Nothing to show."
