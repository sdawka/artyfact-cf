id: affordance.review.accept-with-interpretation
kind: affordance
fields:
  name: Accept amendment
  description: Accepts the amendment with a required Accepted interpretation.
  actor: user
  trigger: click
  preconditions:
    - The amendment is awaiting-admin and no hard violation is present
    - An admin token is set
  effects:
    - Accepted. New Genome commit <sha>, with Open in Map
  failure:
    - "409: a rules violation is named and nothing changes"
links:
  - rel: invokes
    to: endpoint.accept-evolution
