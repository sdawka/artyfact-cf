id: component.review.signifiers
kind: component
fields:
  name: Review signifiers
  description: "Per row and detail header: base against head, promotion membership, conflict chips and the verdict summary. Only pass is green; a missing verdict reads literally unknown."
  states:
    - base = head (subtle)
    - ↻ behind by N (attention)
    - behind head (attention)
    - ● in promotion (attention)
    - § file conflict (attention)
    - ≈ soft-semantic conflict (attention)
    - ⊥ hard-semantic conflict (danger)
    - ◇ evidence conflict (subtle)
    - ✓ 4 pass · ? 1 unknown (attention)
    - ✓ all pass (success)
    - fake provider (subtle)
