id: affordance.review.rerun-checks
kind: affordance
fields:
  name: Re-run checks
  description: A secondary on the candidate's detail that runs its hooks again.
  actor: user
  trigger: click
  preconditions:
    - The candidate's checks are not final
    - An admin token is set
  effects:
    - Checks re-run, n evaluations recorded, and the verdicts update
  failure:
    - "401: set the admin token in the header and try again"
    - "Fixture data: Re-run checks needs the platform API"
links:
  - rel: invokes
    to: endpoint.evaluate
