id: affordance.review.select-composition
kind: affordance
fields:
  name: Add to promotion
  description: A pressed toggle on a candidate's detail that adds it to the promotion (?candidates=); its row then reads ● in promotion. With candidates added and nothing open, the detail lists them under Added to promotion with Promote <Evolution>.
  actor: user
  trigger: click
  preconditions:
    - An app candidate is open
  effects:
    - The toggle is pressed, the row reads ● in promotion and overlap is recomputed
  failure: []
links:
  - rel: references
    to: component.review.promotion
