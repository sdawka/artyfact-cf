id: screen.review
kind: screen
fields:
  name: Review
  description: "The operator's inbox for pending imports, Genome amendments, legacy candidate decisions, Task result selection, and integrated implementation promotion. Task decisions show exact candidate manifests, pinned source/base lineage, changed-file diffs, and recorded evaluations. Execution and planning remain in Work."
  route: /s/:systemId/r/:rev/review
  states:
    - loading
    - loaded
    - empty
    - error
    - fake provider
links:
  - rel: serves
    to: feature.promotion-gate
