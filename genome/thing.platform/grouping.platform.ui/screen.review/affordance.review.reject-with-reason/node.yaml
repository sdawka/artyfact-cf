id: affordance.review.reject-with-reason
kind: affordance
fields:
  name: Reject amendment
  description: Rejects a Genome amendment with a required Rejection reason (danger button).
  actor: user
  trigger: click
  preconditions:
    - A reason is written
    - An admin token is set
  effects:
    - Rejected. Reason recorded, and the row leaves the queue
  failure:
    - "401 or 403: the message says to set the admin token in the header"
links:
  - rel: invokes
    to: endpoint.reject
