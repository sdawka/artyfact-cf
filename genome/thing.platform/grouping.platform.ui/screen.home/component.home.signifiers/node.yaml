id: component.home.signifiers
kind: component
fields:
  name: Card signifiers
  description: The chips on each System card. The headline sentence puts attention first, then evolving, not built, quiet; the deploy line folds the build in. Only pass is green; a missing verdict reads literally unknown, never a blank or a tick.
  states:
    - n await your review (attention)
    - n realizations evolving (subtle)
    - not built (subtle)
    - quiet (subtle)
    - ● deployed · build passed (success)
    - deployed, behind (attention)
    - × deploy failed (danger)
    - deploying (subtle)
    - not deployed, unknown (subtle)
    - fixture (subtle)
    - fake provider (subtle)
