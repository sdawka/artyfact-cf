id: component.home.signifiers
kind: component
fields:
  name: Register signifiers
  description: "The Systems register columns. Name carries the id and Phase on a meta line; Status is one headline by precedence (awaiting review, import, tasks awaiting an agent, promotion, selection, evolving, not built, quiet); Deploy folds the build in. Only a passed build is green; a missing value reads literally unknown. The Shared Parts register lists Name, Version, Description, Dependencies and Published."
  states:
    - System name, id, Phase (subtle)
    - n await your review (attention)
    - ◐ n realizations evolving (subtle)
    - ○ not built (subtle)
    - quiet (subtle)
    - ● deployed, build passed (success)
    - ● deployed, behind (attention)
    - × deploy failed (danger)
    - deploying (subtle)
    - not deployed, unknown (subtle)
    - head sha, updated (subtle)
