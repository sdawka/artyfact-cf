id: screen.home
kind: screen
fields:
  name: Home
  description: "Systems on this platform and what waits on you. The page header reads Systems with the one primary, Start a System. Below it the Needs you ledger, then the Systems register (Name, Status, Deploy, Head, Updated; the whole row opens the System) and the Shared Parts register. The header carries Go to…, Admin token and Effects: on/off; with fixture data it shows Fixture data with Retry API."
  route: /
  states:
    - "loading: Loading Systems…"
    - loaded
    - "empty: No Systems yet."
    - "error: Could not reach the platform API."
    - fixture data
    - fake provider
links:
  - rel: serves
    to: feature.home-dashboard
