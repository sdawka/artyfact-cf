id: affordance.home.retry-api
kind: affordance
fields:
  name: Retry API
  description: Reloads the System list after a failed load. Calls GET /api/systems.
  actor: user
  trigger: click
  preconditions:
    - The System list failed to load
  effects:
    - The list reloads and the cards replace the error
  failure:
    - "Still failing: the error stays with the status shown"
