id: endpoint.evidence
kind: endpoint
fields:
  name: Evidence image
  description: Serves a screenshot a visual check judged, either a platform capture of the preview or one the agent attached at submit, from the EVIDENCE bucket by the key its evaluation cites.
  route: GET /api/systems/:id/evidence
  auth: Anonymous read; a System the registry does not know answers 404 not-found, and so does a key outside the System's evidence prefix.
