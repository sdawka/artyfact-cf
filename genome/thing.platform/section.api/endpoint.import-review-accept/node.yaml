id: endpoint.import-review-accept
kind: endpoint
fields:
  name: Accept a System's import
  description: "Accepts the pending import review with an interpretation; rejected nodes are removed by an accepted Genome amendment."
  route: POST /api/systems/:id/import-review/accept
  auth: "Admin bearer token (ADMIN_TOKEN); 401 without a bearer, 403 for a wrong one, 503 admin-unconfigured when none is set."
  request: SystemImportReviewAccept
  response: SystemImportReviewAcceptResponse
