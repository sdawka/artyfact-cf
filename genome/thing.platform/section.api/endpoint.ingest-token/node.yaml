id: endpoint.ingest-token
kind: endpoint
fields:
  name: Rotate an ingest token
  description: Replaces a deployment's Phenome ingest token; the old one stops working.
  route: POST /api/systems/:id/deployments/:did/ingest-token
  auth: Admin bearer token (ADMIN_TOKEN); 401 without a bearer, 403 for a wrong one, 503 admin-unconfigured when none is set.
  response: IngestTokenResponse
