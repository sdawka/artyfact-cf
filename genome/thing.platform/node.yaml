id: thing.platform
kind: thing
template: template.thing.cloudflare-worker-service@1
root: apps/platform
fields:
  name: Platform
  description: "The artyfact-platform Worker: a Hono API under /api, the React single-page app on Static Assets, the SystemAuthority Durable Object, the Artifacts push-event queue consumer and the hook runner."
links:
  - { rel: artifact, to: artifact.platform }
  - { rel: dependsOn, to: thing.cli }
  - { rel: dependsOn, to: thing.effects }
  - { rel: dependsOn, to: thing.model }
  - { rel: dependsOn, to: thing.ontology }
  - { rel: dependsOn, to: thing.rules }
  - { rel: dependsOn, to: thing.semantic }
  - { rel: dependsOn, to: thing.templates }
  - { rel: calls, to: workflow.artyfact-ci }
  - { rel: exposes, to: endpoint.health }
  - { rel: exposes, to: endpoint.systems }
  - { rel: exposes, to: endpoint.system }
  - { rel: exposes, to: endpoint.model }
  - { rel: exposes, to: endpoint.start-work }
  - { rel: exposes, to: endpoint.submit }
  - { rel: exposes, to: endpoint.promote }
  - { rel: exposes, to: endpoint.changelog }
  - { rel: exposes, to: endpoint.compare-system }
  - { rel: exposes, to: endpoint.intents-create }
  - { rel: exposes, to: endpoint.intents-decisions }
files:
  - e2e/**
  - playwright.config.ts
  - vite.*.ts
  - tsconfig.worker.json
  - wrangler.*.jsonc
  - .dev.vars.example
  - amendment-dev.html
criteria:
  - id: C.platform.promotion
    title: Promotion is a compare-and-swap
    claim: Promoting a candidate built on an old head returns 409 stale-base and leaves the head unchanged; the gate fails closed on unknown verdicts.
    target: artifact
    gates:
      - candidate
      - promotion
    hooks:
      - id: hook.platform.promotion
        assay: platform.promotion
        tier: execution
        engine: vitest
        triggers:
          - candidate
          - promotion
        inputs:
          command: npm test -w @artyfact/platform -- test/do.test.ts
  - id: C.platform.routes
    title: API routes answer their contract
    claim: Each /api route returns the documented status and body, including 401, 403 and 404 for callers without access or unknown Systems.
    target: artifact
    gates:
      - candidate
      - promotion
    hooks:
      - id: hook.platform.routes
        assay: platform.routes
        tier: execution
        engine: vitest
        triggers:
          - candidate
          - promotion
        inputs:
          command: npm test -w @artyfact/platform -- test/routes.test.ts
  - id: C.platform.loop
    title: The agent loop runs end to end
    claim: Start work, checkpoint, submit and promote run against the fake Artifacts namespace and produce one System commit.
    target: artifact
    gates:
      - candidate
      - promotion
    hooks:
      - id: hook.platform.loop
        assay: platform.loop
        tier: execution
        engine: vitest
        triggers:
          - candidate
          - promotion
        inputs:
          command: npm test -w @artyfact/platform -- test/integration/loop.test.ts
  - id: C.platform.e2e-fake
    title: Fake-platform use cases pass in a browser
    claim: The Playwright @fake specs drive Home, Work, Code, Compare and describe-a-change against FAKE_ARTIFACTS=1 without failures.
    target: artifact
    gates:
      - candidate
      - promotion
    hooks:
      - id: hook.platform.e2e-fake
        assay: platform.e2e-fake
        tier: execution
        engine: browser
        triggers:
          - candidate
          - promotion
        inputs:
          command: npm run e2e:fake -w @artyfact/platform
  - id: C.thing.platform.checks
    title: Changed nodes meet their checks
    claim: Changed nodes meet the checks their kinds declare.
    severity: soft
    gates:
      - submission
    hooks:
      - id: hook.thing.platform.checks
        assay: platform.checks
        tier: semantic
        engine: model-rules
        triggers:
          - submission
        inputs:
          packs: checks@1
        binding: bound
        fromTemplate: template.thing.cloudflare-worker-service@1
    fromTemplate: template.thing.cloudflare-worker-service@1
