id: thing.rules
kind: thing
template: template.thing.ts-library@1
root: packages/rules
fields:
  name: Rules
  description: "@artyfact/rules: the Datalog engine that runs versioned Rule Packs and explains each derived fact."
links:
  - { rel: artifact, to: artifact.rules }
  - { rel: exposes, to: export.rules.parse }
  - { rel: exposes, to: export.rules.run }
  - { rel: exposes, to: export.rules.explain }
criteria:
  - id: C.rules.unit
    title: "@artyfact/rules tests pass"
    claim: The parser, stratifier, engine and explanations pass their suites, including the property tests.
    target: artifact
    gates:
      - candidate
      - promotion
    hooks:
      - id: hook.rules.unit
        assay: rules.unit
        tier: execution
        engine: vitest
        triggers:
          - candidate
          - promotion
        inputs:
          command: npm test -w @artyfact/rules
  - id: C.thing.rules.checks
    title: Changed nodes meet their checks
    claim: Changed nodes meet the checks their kinds declare.
    severity: soft
    gates:
      - submission
    hooks:
      - id: hook.thing.rules.checks
        assay: rules.checks
        tier: semantic
        engine: model-rules
        triggers:
          - submission
        inputs:
          packs: checks@1
        binding: bound
        fromTemplate: template.thing.ts-library@1
    fromTemplate: template.thing.ts-library@1
