id: thing.cli
kind: thing
template: template.thing.cli@1
root: packages/cli
files:
  - scripts/bundle.mjs
fields:
  name: artyfact CLI
  description: "The artyfact command-line tool: sets up a System's repos, starts and submits realizations for agents, manages Parts, converts Genomes and releases the platform's own builds through Artifacts."
links:
  - { rel: artifact, to: artifact.cli }
  - { rel: dependsOn, to: thing.model }
  - { rel: dependsOn, to: thing.ontology }
  - { rel: dependsOn, to: thing.templates }
  - { rel: exposes, to: command.init }
  - { rel: exposes, to: command.start }
  - { rel: exposes, to: command.checkpoint }
  - { rel: exposes, to: command.submit }
  - { rel: exposes, to: command.release }
  - { rel: exposes, to: command.convert-genome }
  - { rel: exposes, to: command.validate-genome }
  - { rel: exposes, to: command.skill }
  - { rel: exposes, to: command.ontology-check }
  - { rel: exposes, to: command.ontology-agreement }
  - { rel: exposes, to: command.ontology-materialize }
criteria:
  - id: C.cli.unit
    title: "artyfact CLI tests pass"
    claim: Init, naming, platform discovery, Parts and convert-genome suites pass against local bare repos.
    target: artifact
    gates:
      - candidate
      - promotion
    hooks:
      - id: hook.cli.unit
        assay: cli.unit
        tier: execution
        engine: vitest
        triggers:
          - candidate
          - promotion
        inputs:
          command: pnpm --filter artyfact test
  - id: C.thing.cli.checks
    title: Changed nodes meet their checks
    claim: Changed nodes meet the checks their kinds declare.
    severity: soft
    gates:
      - submission
    hooks:
      - id: hook.thing.cli.checks
        assay: cli.checks
        tier: semantic
        engine: model-rules
        triggers:
          - submission
        inputs:
          packs: checks@1
        binding: bound
        fromTemplate: template.thing.cli@1
    fromTemplate: template.thing.cli@1
