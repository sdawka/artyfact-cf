id: thing.site
kind: thing
template: template.thing.static-site@1
root: apps/site
fields:
  name: Public site
  description: The artyfact-site Worker serving the prerendered public pages at artyfact.ing, with one hydrated example island and the shared ambient effect. Its build reads the repository's own Genome to draw the How it works diagram.
links:
  - { rel: artifact, to: artifact.site }
  - { rel: dependsOn, to: thing.effects }
  - { rel: dependsOn, to: thing.model }
  - { rel: dependsOn, to: thing.templates }
  - { rel: exposes, to: page.home }
  - { rel: exposes, to: page.model }
  - { rel: exposes, to: page.connect-agent }
  - { rel: exposes, to: page.how-it-works }
files:
  - e2e/**
  - playwright.config.ts
  - vitest.config.ts
criteria:
  - id: C.site.build
    title: The build prerenders every page
    claim: The build writes an index.html per page, a 404 page and a sitemap, and the pages work without JavaScript.
    target: artifact
    gates:
      - candidate
      - promotion
    hooks:
      - id: hook.site.build
        assay: site.build
        tier: execution
        engine: vitest
        triggers:
          - candidate
          - promotion
        inputs:
          command: pnpm --filter @artyfact/site test
  - id: C.thing.site.checks
    title: Changed nodes meet their checks
    claim: Changed nodes meet the checks their kinds declare.
    severity: soft
    gates:
      - submission
    hooks:
      - id: hook.thing.site.checks
        assay: site.checks
        tier: semantic
        engine: model-rules
        triggers:
          - submission
        inputs:
          packs: checks@1
        binding: bound
        fromTemplate: template.thing.static-site@1
    fromTemplate: template.thing.static-site@1
