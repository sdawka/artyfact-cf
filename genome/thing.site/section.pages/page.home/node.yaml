  description: Introduces Artyfact through one illustrative application shown as Genome, Proteome and Phenome, so a visitor learns what the platform is for. Below the story it shows the model's nesting with three defined terms, the practices as grouped rows, the agent environment as three zones (brief, guardrails, freedom) with the parallel-agents line pulled out, the Cloudflare backbone diagram with each product's job, and a closing panel with every way to get Artyfact (the source on GitHub, the hosted platform, the agent guide, how it works, the theory).
