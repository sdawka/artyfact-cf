id: page.connect-agent
kind: page
fields:
  name: Bring your agent
  route: /connect-agent
  rendering: prerendered
  description: Explains the handoff around the model. A local agent claims a Task, works in an Artifacts fork that holds the app code and the pinned model under system/, with a brief naming the nodes it realizes, and submits a candidate; checks from the model run in three layers, and the reviewed result is promoted. The model in the fork is read-only by default; when it cannot be built as written the agent may change it, and the change becomes a model delta judged by System One against the whole ontology and reviewed beside the code.
