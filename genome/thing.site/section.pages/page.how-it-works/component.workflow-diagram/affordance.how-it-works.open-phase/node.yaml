  actor: visitor
  trigger: Activate a phase heading with a pointer or the keyboard.
  effects:
    - Show what happens in the phase, who acts, its commands and screens, its guardrails and its model node ids.
  failure:
    - Without JavaScript the disclosure still opens and closes; it is native HTML.
