# The steps live in scripts/ci.mjs, which the pre-push hook runs too (`npm run ci`).
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Self-hosted Macs: never run code from forks on them.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Pull request, scoped to the changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm run ci -- --changed --base "origin/$BASE_REF"
      - name: Manual run, everything
        if: github.event_name == 'workflow_dispatch'
        run: npm run ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            apps/platform/e2e-artifacts
            apps/site/e2e-artifacts
          retention-days: 14
          if-no-files-found: ignore
