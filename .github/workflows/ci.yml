name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cache node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.modules.outputs.cache-hit != 'true'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @artyfact/platform

      - name: Read pinned Playwright version
        id: pw
        run: echo "version=$(node -p "require('./apps/platform/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium and system deps
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system deps only
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Playwright (fixture mode, no Cloudflare login)
        run: npm run e2e
        working-directory: apps/platform
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: apps/platform/e2e-artifacts
          retention-days: 14
          if-no-files-found: ignore
