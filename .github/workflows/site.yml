name: public-site
on:
  push:
  pull_request:
jobs:
  verify-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @artyfact/site
      - run: npm run build -w @artyfact/site
      - run: npm run test -w @artyfact/site
      - run: npm run test:build -w @artyfact/site
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -w @artyfact/site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-site-browser-results
          path: apps/site/e2e-artifacts
          if-no-files-found: ignore
