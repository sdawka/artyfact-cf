packages:
  - packages/*
  - apps/*
  - examples/*

# Dependencies allowed to run install scripts (esbuild and workerd fetch their native binaries).
allowBuilds:
  esbuild: true
  workerd: true

patchedDependencies:
  '@cloudflare/ci@0.2.0': patches/@cloudflare__ci@0.2.0.patch

# Security: lift exact transitive pins (miniflare, @cloudflare/vitest-plugin) to patched releases in the same major.
overrides:
  'undici@>=7 <7.30.1': ^7.30.1
  'undici@>=8 <8.12.2': ^8.12.2
  'zod@>=4 <4.6.6': ^4.6.6
